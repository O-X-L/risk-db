---

summary: 'List ASNs of a specific kind'

parameters:
  - in: 'path'
    name: 'kind'
    description: 'Kind to query'
    type: 'string'
    enum: ['hosting', 'vpn', 'scanner', 'crawler', 'isp', 'education']

definitions:
  ASNList:
    type: 'array'
    items:
      type: 'number'

  ErrorMsg:
    type: 'object'
    properties:
      msg:
        type: 'string'
        description: 'Error Message'

responses:
  200:
    description: 'List of ASNs of that kind'
    schema:
      $ref: '#/definitions/ASNList'
  400:
    description: 'Invalid KIND provided'
    schema:
      $ref: '#/definitions/ErrorMsg'
  404:
    description: 'Temporary lookup failure'
    schema:
      $ref: '#/definitions/ErrorMsg'
